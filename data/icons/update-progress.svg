<svg xmlns='http://www.w3.org/2000/svg' xmlns:gpa='https://www.gtk.org/grappa' width='16' height='16' viewBox='0 0 16 16'
     gpa:version='1' gpa:state='0'
     gpa:state-names='waiting checking downloading p1 p2 p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing failed'>
  <!-- App update progress, one state per phase; p1..p20 fill the rim in 5% steps.
       Effects are SMIL only: gpa transitions delay state changes, and GTK 4.22
       drops visibility updates when states change faster than that delay. -->
  <circle cx='8' cy='8' r='6.5' fill='none' stroke-width='1.5' stroke-opacity='0.25' gpa:stroke='foreground'/>
  <circle cx='5' cy='8' r='1' gpa:fill='foreground' gpa:states='waiting'>
    <animate attributeName='fill-opacity' values='0.25;1;0.25' dur='1.2s' repeatCount='indefinite'/>
  </circle>
  <circle cx='8' cy='8' r='1' gpa:fill='foreground' gpa:states='waiting'>
    <animate attributeName='fill-opacity' values='0.25;1;0.25' dur='1.2s' begin='0.2s' repeatCount='indefinite'/>
  </circle>
  <circle cx='11' cy='8' r='1' gpa:fill='foreground' gpa:states='waiting'>
    <animate attributeName='fill-opacity' values='0.25;1;0.25' dur='1.2s' begin='0.4s' repeatCount='indefinite'/>
  </circle>
  <circle cx='8' cy='8' r='1' fill='none' stroke-width='1.2' gpa:stroke='accent' gpa:states='checking'>
    <animate attributeName='r' values='1;6' dur='1.2s' repeatCount='indefinite'/>
    <animate attributeName='stroke-opacity' values='1;0' dur='1.2s' repeatCount='indefinite'/>
  </circle>
  <circle cx='8' cy='8' r='1.5' gpa:fill='accent' gpa:states='checking'/>
  <path d='M 8 4.6 L 8 10.6 M 5.6 8.3 L 8 10.7 L 10.4 8.3' fill='none' stroke-width='1.4' stroke-linecap='round' stroke-linejoin='round'
        gpa:stroke='accent' gpa:states='downloading p1 p2 p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20'>
    <animateTransform attributeName='transform' type='translate' values='0 -0.8;0 0.8;0 -0.8' dur='1s' repeatCount='indefinite'/>
  </path>
  <path d='M 8.00 1.50 A 6.5 6.5 0 0 1 10.01 1.82' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p1 p2 p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 10.01 1.82 A 6.5 6.5 0 0 1 11.82 2.74' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p2 p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 11.82 2.74 A 6.5 6.5 0 0 1 13.26 4.18' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p3 p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 13.26 4.18 A 6.5 6.5 0 0 1 14.18 5.99' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p4 p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 14.18 5.99 A 6.5 6.5 0 0 1 14.50 8.00' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p5 p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 14.50 8.00 A 6.5 6.5 0 0 1 14.18 10.01' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p6 p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 14.18 10.01 A 6.5 6.5 0 0 1 13.26 11.82' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p7 p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 13.26 11.82 A 6.5 6.5 0 0 1 11.82 13.26' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p8 p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 11.82 13.26 A 6.5 6.5 0 0 1 10.01 14.18' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p9 p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 10.01 14.18 A 6.5 6.5 0 0 1 8.00 14.50' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p10 p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 8.00 14.50 A 6.5 6.5 0 0 1 5.99 14.18' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p11 p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 5.99 14.18 A 6.5 6.5 0 0 1 4.18 13.26' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p12 p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 4.18 13.26 A 6.5 6.5 0 0 1 2.74 11.82' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p13 p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 2.74 11.82 A 6.5 6.5 0 0 1 1.82 10.01' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p14 p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 1.82 10.01 A 6.5 6.5 0 0 1 1.50 8.00' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p15 p16 p17 p18 p19 p20 installing'/>
  <path d='M 1.50 8.00 A 6.5 6.5 0 0 1 1.82 5.99' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p16 p17 p18 p19 p20 installing'/>
  <path d='M 1.82 5.99 A 6.5 6.5 0 0 1 2.74 4.18' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p17 p18 p19 p20 installing'/>
  <path d='M 2.74 4.18 A 6.5 6.5 0 0 1 4.18 2.74' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p18 p19 p20 installing'/>
  <path d='M 4.18 2.74 A 6.5 6.5 0 0 1 5.99 1.82' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p19 p20 installing'/>
  <path d='M 5.99 1.82 A 6.5 6.5 0 0 1 8.00 1.50' fill='none' stroke-width='1.5' gpa:stroke='accent' gpa:states='p20 installing'/>
  <circle cx='8' cy='8' r='2' gpa:fill='accent' gpa:states='installing'>
    <animate attributeName='r' values='1.5;3;1.5' dur='1s' repeatCount='indefinite'/>
  </circle>
  <circle cx='8' cy='8' r='7.25' gpa:fill='warning' gpa:states='failed'>
    <animate attributeName='r' from='2' to='7.25' dur='250ms' begin='gpa:states(failed).begin' fill='freeze'/>
  </circle>
  <path d='M 8 4.2 L 8 8.8' fill='none' stroke-width='1.6' stroke-linecap='round'
        pathLength='1' stroke-dasharray='1' gpa:stroke='#1c1c1c' gpa:states='failed'>
    <animate attributeName='stroke-dashoffset' values='1;1;0' keyTimes='0;0.4;1' dur='450ms' begin='gpa:states(failed).begin' fill='freeze'/>
  </path>
  <circle cx='8' cy='11.4' r='0.9' gpa:fill='#1c1c1c' gpa:states='failed'/>
</svg>
